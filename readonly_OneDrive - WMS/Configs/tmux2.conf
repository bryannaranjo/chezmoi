
##### Basics
set -g mouse on
set -g history-limit 10000
set -g escape-time 0
set -g terminal-overrides ',xterm-256color:Tc'

# Ensure tmux uses a valid shell (fixes plugin/ENV issues)
set-option -g default-shell /bin/zsh

##### Status bar styling
set -g status on
set -g status-interval 5
set -g status-style bg=black,fg=white

# Left: hostname | icon + session | separator
set -g status-left-length 50
set -g status-left "#[fg=green,bold]#H #[fg=colour8,nobold]| #[default]#[bold] #[default]#S #[fg=colour8,nobold]| "

# Right: window list is centered, date/time on right
setw -g window-status-current-format "#[fg=white,bg=blue,bold] #I:#W #[default]"
setw -g window-status-format " #I:#W "
set -g status-right-length 100
set -g status-right "#[fg=colour8]#(whoami)@#H #[fg=colour8]| #[fg=cyan]%Y-%m-%d #[fg=green]%H:%M #[default]"

##### Plugins (TPM)
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'         # Good defaults
set -g @plugin 'tmux-plugins/tmux-resurrect'        # Save/restore sessions
set -g @plugin 'tmux-plugins/tmux-continuum'        # Auto-save
set -g @plugin 'tmux-plugins/tmux-prefix-highlight' # Shows when prefix is pressed
# Optional: battery (Linux/macOS)
set -g @plugin 'tmux-plugins/tmux-battery'

# Resurrect/Continuum settings (optional)
set -g @continuum-restore 'on'
set -g @resurrect-strategy-vim 'session'
set -g @resurrect-capture-pane-contents 'on'

# Initialize TPM (keep this last)
run '~/.tmux/plugins/tpm/tpm'
