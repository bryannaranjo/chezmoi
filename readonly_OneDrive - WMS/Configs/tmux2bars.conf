
##### Refresh interval
set -g status-interval 5

##### Colors (Powerline-style)
set -g status-bg colour234
set -g status-fg colour250

# Increase space so it doesn't truncate
set -g status-left-length 60
set -g status-right-length 180

##### Use status-format for two lines
set -g status 2

# Powerline separators (require Nerd Font or Powerline font)
# Left separators:   Right separators: 

# 1st line: Session | Windows | Host
set -g status-format[0] \
"#[bg=colour30,fg=colour16]  #S #[bg=colour24,fg=colour30] #[bg=colour24,fg=colour16] 缾 #I #[bg=colour234,fg=colour24] #[bg=colour234,fg=colour81] #H "

# 2nd line: IP | OS | Uptime | Updates | Load | Mem | Battery | Date & Time
set -g status-format[1] \
"#[bg=colour31,fg=colour16]  #(ip route get 1.1.1.1 | awk '{print $7; exit}') \
#[bg=colour24,fg=colour31] #[bg=colour24,fg=colour16]  #(lsb_release -ds 2>/dev/null || grep -Po '(?<=^PRETTY_NAME=).+' /etc/os-release | tr -d '\"') \
#[bg=colour23,fg=colour24] #[bg=colour23,fg=colour16] 祥 #(uptime -p | sed 's/up //') \
#[bg=colour22,fg=colour23] #[bg=colour22,fg=colour16] ﮮ #(command -v apt >/dev/null 2>&1 && apt list --upgradable 2>/dev/null | grep -c upgradable || (command -v dnf >/dev/null 2>&1 && dnf check-update --quiet | wc -l || echo -n 'N/A')) \
#[bg=colour21,fg=colour22] #[bg=colour21,fg=colour16]  #(awk -F'load average: ' '{print $2}' /proc/loadavg 2>/dev/null | cut -d' ' -f1 || uptime | awk -F'load average:' '{print $2}' | cut -d',' -f1) \
#[bg=colour20,fg=colour21] #[bg=colour20,fg=colour16]  #(free -m | awk '/Mem:/ {printf \"%d%%\", ($3/$2)*100}') \
#[bg=colour19,fg=colour20] #[bg=colour19,fg=colour16]  #(cat /sys/class/power_supply/BAT0/capacity 2>/dev/null || pmset -g batt 2>/dev/null | grep -Eo '\\d+%') \
#[bg=colour234,fg=colour19] #[bg=colour234,fg=colour250]  %Y-%m-%d  %H:%M "

##### Window list style (compact)
setw -g window-status-format "#[fg=colour244] #I:#W "
setw -g window-status-current-format "#[bg=colour238,fg=colour15] #I:#W "

##### Pane border contrast
set -g pane-border-style "fg=colour239"
set -g pane-active-border-style "fg=colour81"

##### Optional: mouse for easier navigation
set -g mouse on
